name: Postgres Migration & CI Pipeline

on:
  push:
    branches: [master, staging, dev] # Changed main to master
  pull_request:
    branches: [master, staging] # Changed main to master

jobs:
  prisma-db-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrations
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then   # Changed main to master
            echo "Applying migrations to PRODUCTION..."
            DATABASE_URL="$PROD_DATABASE_URL" npx prisma migrate deploy
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "Applying migrations to STAGING..."
            DATABASE_URL="$STAGING_DATABASE_URL" npx prisma migrate deploy
          else
            echo "Applying migrations to DEVELOPMENT..."
            DATABASE_URL="$DEV_DATABASE_URL" npx prisma migrate deploy
          fi

      - name: Generate Prisma Client
        run: npx prisma generate
